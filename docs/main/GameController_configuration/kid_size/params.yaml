# Kid Size 3v3：沿用 middle/params.yaml 的比赛规则。
# 场地尺寸来源：机器人 types.h 中的 FD_KIDSIZE；以下单位均为米。
# /home/booster/Workspace/K1_5v5_demo_1.7/src/brain/include/types.h
# 场地白线范围：长 9，宽 6。
# 罚球点距底线：1.5。
# 球门宽度：2.6。
# 中圈半径：0.75；直径：1.5。
# 大禁区：纵深 2，横向宽度 5。
# 小禁区：纵深 1，横向宽度 3。
# 本版 GameController 不读取场地尺寸；这些注释仅供核对。
# 机器人 brain 配置使用 game.field_type: "kid_size"。
# division 是裁判机的分组枚举，与机器人 field_type 分开设置。
# 保留有效值 small；不能在此写 division: kid_size。
